# pnpm 9 reads this file as a workspace definition alone and refuses it without
# a packages list. pnpm 10 and 11, which also read their settings from here,
# accept it either way. Empty is accurate: there are no sub-packages.
packages: []

# perun-atlas depends on spatial, and spatial on perun-core, both through git
# URLs -- pnpm 11 refuses git-resolved subdependencies by default. Every
# dependency in this graph is a first-party repository on gitlab.prtech.mk, so
# that layering is the house architecture rather than something to work around.
blockExoticSubdeps: false

# A subdependency carries an advisory its parent pins too tightly to fix on its
# own: monaco-editor asks for dompurify 3.4.8 exactly. It does not reach the
# shipped bundle -- monaco arrives through perun-core, which is external -- so
# this clears the audit and protects the dev machine rather than changing what
# ships. Mirrors svarog-spatial, which also overrides uuid for the sockjs its
# webpack-dev-server brings; this package has neither any more.
#
# pnpm 11 reads overrides from here; pnpm 9 and 10 read them from the "pnpm"
# field of package.json. Both are declared, and must be kept in step.
overrides:
  dompurify: ^3.4.15
  # spatial 4.2.1 declares perun-core#dev, a branch, beside this package's
  # own #semver:^4.5.8-rc.1. Left alone the two resolve apart -- the branch to
  # its tip on the day of a resolve -- and this install holds two perun-cores.
  # The override makes them one, at the version package.json names. It reaches
  # this repository's install only; a consumer's overrides are its own. It can
  # go once this package depends on a spatial that names perun-core by version.
  perun-core: git+https://git@gitlab.prtech.mk/svarog4/perun-core#semver:^4.5.8-rc.1
