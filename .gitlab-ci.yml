stages:
  - 1_linter
  - 2_build_and_install
  - 3_mvn_install
  - 4_generate_js

before_script:
  - pwd
  - echo $CI_BUILD_REF_NAME
  - git remote -v
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

# The two rules this bundle exists to hold. Neither needs node_modules, so this
# runs alongside the install rather than after it, and fails in seconds.
1_architecture_guards:
  stage: 1_linter
  script:
    - |
      echo "--- only frontend/spatial.js may import the engine ---"
      # Bare specifier only: internal modules importing '../spatial' are the
      # supported path and must not trip this.
      offenders=$(grep -rln --include='*.js' --include='*.jsx' -E "from ['\"]spatial['\"]" frontend/ | grep -v '^frontend/spatial.js$' || true)
      if [ -n "$offenders" ]; then
        echo "Engine imported outside the shim. One file owns that relationship:"
        echo "$offenders" | sed 's/^/  /'
        echo "Route the call through frontend/spatial.js, or add what is missing to it."
        exit 1
      fi
      echo "ok - the engine has exactly one caller"
    - |
      echo "--- no deployment coordinates in the bundle ---"
      # Centre, bounds and CRS resolve from SVAROG_SYS_PARAMS at runtime; none belongs in source.
      coords=$(grep -rnE '\[[[:space:]]*-?[0-9]{1,3}\.[0-9]+[[:space:]]*,[[:space:]]*-?[0-9]{1,3}\.[0-9]+[[:space:]]*\]' --include='*.js' --include='*.jsx' frontend/ || true)
      if [ -n "$coords" ]; then
        echo "Coordinate literal in source:"
        echo "$coords" | sed 's/^/  /'
        echo "Declare it in frontend/config/Schema.js and resolve it per deployment."
        exit 1
      fi
      echo "ok - no coordinates baked in"
    - |
      echo "--- nothing from any one deployment's domain ---"
      # Upper-case and word-bounded, so ordinary prose passes.
      domain=$(grep -rnE '\b(ANIMAL|ANIMALS|HOLDING|HOLDINGS|MOVEMENT|MOVEMENTS|EAR_TAG|EARTAG|PIC|AREA_HEALTH|AREA_STATUS|SVAROG_SDI_UNITS|QUARANTINE)\b' --include='*.js' --include='*.jsx' --include='*.css' frontend/ || true)
      endpoints=$(grep -rniE 'WsAims|/SDI/' --include='*.js' --include='*.jsx' --include='*.css' frontend/ || true)
      if [ -n "$domain$endpoints" ]; then
        echo "A caller's domain has leaked into the shared layer:"
        echo "$domain$endpoints" | sed 's/^/  /'
        echo "Pass it in as a descriptor, a prop or a service path instead."
        exit 1
      fi
      echo "ok - no caller's domain in here"

1_pnpm_install_test_build:
  stage: 1_linter
  script:
    - pwd
    - git reset --hard HEAD
    # pnpm silently skips an optional native binding whose engines do not match, so a runner below
    # package.json's floor would fail deep inside rolldown instead of here.
    - |
      floor=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
      have=$(node -p "process.versions.node")
      if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" != "$floor" ]; then
        echo "This runner has node $have; this package needs $floor or newer."
        echo "vitest, vite and oxlint declare it, and their native bindings are optional"
        echo "dependencies -- pnpm skips one whose engines do not match without"
        echo "printing anything, so the suite would fail three layers lower down."
        echo "Upgrade node on the runner rather than changing anything here."
        exit 1
      fi
      echo "ok - node $have meets the floor of $floor"
    - rm -rf node_modules
    - pnpm install --frozen-lockfile
    - pnpm run lint
    - pnpm run test
    - pnpm run build

1_build_test_java:
  stage: 2_build_and_install
  script:
    - cd backend
    - mvn clean
    - mvn test

1_perun-atlas-install:
  stage: 3_mvn_install
  script:
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile
    - rm -rf backend/www/*.js
    - pnpm run build
    - cd backend
    - ls -al www/
    - pwd
    - mvn clean compile deploy -DskipTests
  only:
    - main

# Manual, since it writes to the repository. The bundle and its on-demand modules are committed
# because consumers install this package from git.
1_perun-atlas-generate-js:
  stage: 4_generate_js
  script:
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install --frozen-lockfile
    - rm -rf backend/www/*.js
    - pnpm run build
    - url_host=`git remote get-url origin | sed -e "s/https:\/\/gitlab-ci-token:.*@//g"`
    - git remote set-url origin "https://gitlab-ci-token:${K8S_SECRET_GITLABCI_TOKEN}@${url_host}"
    - git remote -v
    - git add backend/www/*.js
    - git commit -m "Auto commit of perun-atlas bundle for npm" || exit 0
    - git push origin HEAD:$CI_COMMIT_REF_NAME
  only:
    - main
  when: manual
